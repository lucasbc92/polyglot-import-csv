name: release

# A tag v* builds the executables for Windows and Linux and publishes them as a
# GitHub release. workflow_dispatch builds the same artifacts without
# publishing anything, to check the pipeline.
on:
  push:
    tags: ["v*"]
    branches: [tcc2-gui]  # TEMPORARY: exercise the pipeline before the merge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Windows: the GUI tests were written and measured on this platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,gui]"
      - name: Test
        run: python -m pytest tests -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            exe: ".exe"
          - os: ubuntu-latest
            platform: linux-x64
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]" pyinstaller
      - name: Cassandra driver loads
        # The dry-run below never imports the driver, so check it here.
        run: python -c "import cassandra.cluster, cassandra.io.asyncioreactor"
      - name: Build
        run: pyinstaller polyglotimportcsv.spec --noconfirm
      - name: Smoke test
        shell: bash
        env:
          POLYGLOT_NO_LOG: "1"
        run: |
          ./dist/polyglotimportcsv${{ matrix.exe }} --help
          ./dist/polyglotimportcsv${{ matrix.exe }} --config data/ecommerce/import_config.json --dry-run --no-data
          ./dist/polyglotimportcsv-gui${{ matrix.exe }} --cli --config data/ecommerce/import_config.json --dry-run --no-data
      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then TAG="$GITHUB_REF_NAME"; else TAG="dev-${GITHUB_SHA::7}"; fi
          python scripts/package_release.py --tag "$TAG" --os ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: release-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: PolyglotImportCSV ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: release/*.zip
          fail_on_unmatched_files: true
