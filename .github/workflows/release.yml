name: release

# A tag v* builds the executables for Windows and Linux and publishes them as a
# GitHub release. workflow_dispatch builds the same artifacts without
# publishing anything, to check the pipeline (see the release job's `if`).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Windows: the GUI tests were written and measured on this platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,gui]"
      - name: Test
        run: python -m pytest tests -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            exe: ".exe"
          # The oldest supported runner, on purpose: a PyInstaller build runs
          # only on the glibc it was built against or newer, and ubuntu-latest
          # (glibc 2.39) produced binaries that would not start on Ubuntu 22.04
          # or Debian 12.
          - os: ubuntu-22.04
            platform: linux-x64
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libxcb-* and libxkbcommon-x11 are what Qt's xcb plugin loads; having
          # them here lets PyInstaller bundle them, so the GUI opens on desktops
          # that do not ship them.
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 libxcb-util1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]" pyinstaller
      - name: Cassandra driver loads
        # The dry-run below never imports the driver, so check it here.
        run: python -c "import cassandra.cluster, cassandra.io.asyncioreactor"
      - name: Build
        run: pyinstaller polyglotimportcsv.spec --noconfirm
      - name: Smoke test
        shell: bash
        env:
          POLYGLOT_NO_LOG: "1"
        run: |
          ./dist/polyglotimportcsv${{ matrix.exe }} --help
          ./dist/polyglotimportcsv${{ matrix.exe }} --config data/ecommerce/import_config.json --dry-run --no-data
          ./dist/polyglotimportcsv-gui${{ matrix.exe }} --cli --config data/ecommerce/import_config.json --dry-run --no-data
          set +e
          ./dist/polyglotimportcsv${{ matrix.exe }} --config data/ecommerce/import_config.json --check-dbms > check.txt 2>&1
          code=$?
          set -e
          cat check.txt
          test "$code" -eq 1
          grep -q "DBMS not ready" check.txt
      - name: GUI starts
        # The smoke test above never imports Qt (--cli returns first), so open
        # the window for real: it must still be running when timeout stops it.
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          timeout 20 ./dist/polyglotimportcsv-gui
          test $? -eq 124
      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then TAG="$GITHUB_REF_NAME"; else TAG="dev-${GITHUB_SHA::7}"; fi
          python scripts/package_release.py --tag "$TAG" --os ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: release-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: PolyglotImportCSV ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: release/*.zip
          fail_on_unmatched_files: true
